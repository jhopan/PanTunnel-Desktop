name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  tags: ['v*']

jobs:
  test:
    name: vet + test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  config-check:
    name: config check against real cores
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build CLI
        run: go build -o bin/PanTunnel.exe .
      - name: Download cores
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path cores | Out-Null
          gh release download core-v1.0.2 -R jhopan/JPS-Tunnel -p 'JPS-Tunnel-Core-windows-amd64.exe' -D cores --clobber
          gh release download v1.14.4 -R SagerNet/sing-box -p 'sing-box-1.14.4-windows-amd64.zip' -D cores --clobber
          Expand-Archive cores/sing-box-1.14.4-windows-amd64.zip -DestinationPath cores/sb14
      - name: Dump configs and validate
        shell: pwsh
        run: |
          $uri = 'vless://00000000-0000-0000-0000-000000000000@server.example:443?type=ws&security=tls&path=%2Fvless&sni=sni.example&host=host.example#CI'
          $cores = @(
            @{ name = 'jps-1.11.15'; exe = 'cores/JPS-Tunnel-Core-windows-amd64.exe'; dialect = 'legacy'; wants = 'legacy' },
            @{ name = 'sing-box-1.14.4'; exe = 'cores/sb14/sing-box.exe'; dialect = 'auto'; wants = 'modern' }
          )
          $failed = $false
          foreach ($core in $cores) {
            $out = "auto-$($core.name).json"
            $log = & bin/PanTunnel.exe --dump-config $out --vless $uri --dialect $core.dialect 2>&1
            Write-Host $log
            if ($log -notmatch $core.wants) { Write-Error "dialek salah untuk $($core.name)"; $failed = $true }
            & $core.exe check -c $out 2>&1 | Tee-Object -Variable checkOut | Out-Host
            if ($LASTEXITCODE -ne 0 -or ($checkOut -join "`n") -match 'FATAL') { Write-Error "config ditolak $($core.name)"; $failed = $true }
          }
          if ($failed) { exit 1 }

  build:
    name: build ${{ matrix.name }}
    needs: [test, config-check]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-amd64, runner: windows-latest, output: PanTunnel-Desktop-windows-amd64.exe, ldflags: '-s -w -H windowsgui' }
          - { name: linux-amd64, runner: ubuntu-latest, output: PanTunnel-Desktop-linux-amd64, ldflags: '-s -w' }
          - { name: macos-apple, runner: macos-latest, output: PanTunnel-Desktop-macos-apple, ldflags: '-s -w' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install Gio Linux headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libegl1-mesa-dev libxcursor-dev libxfixes-dev \
            libvulkan-dev
      - name: Build
        shell: bash
        run: go build -ldflags="${{ matrix.ldflags }}" -o "${{ matrix.output }}" .
      - uses: actions/upload-artifact@v4
        with:
          name: pantunnel-${{ matrix.name }}
          path: ${{ matrix.output }}
          if-no-files-found: error

  core:
    name: core ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-amd64, runner: windows-latest, goos: windows, goarch: amd64, output: PanTunnel-Core-windows-amd64.exe }
          - { name: linux-amd64, runner: ubuntu-latest, goos: linux, goarch: amd64, output: PanTunnel-Core-linux-amd64 }
          - { name: macos-apple, runner: macos-latest, goos: darwin, goarch: arm64, output: PanTunnel-Core-macos-apple }
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Build sing-box core
        shell: bash
        env:
          SINGBOX_VERSION: '1.11.15'
          TAGS: 'with_gvisor,with_clash_api'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "v$SINGBOX_VERSION" https://github.com/SagerNet/sing-box.git sing-box
          cd sing-box
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath \
            -tags "$TAGS" \
            -ldflags "-s -w -X github.com/sagernet/sing-box/constant.Version=v$SINGBOX_VERSION" \
            -o "../${{ matrix.output }}" ./cmd/sing-box
          cd ..
          ls -l "${{ matrix.output }}"
      - uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.name }}
          path: ${{ matrix.output }}
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, core]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true
          path: dist/
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          body: |
            ## PanTunnel Desktop ${{ github.ref_name }}

            Klien VPN desktop berbasis sing-box (TUN gVisor), VLESS WS TLS, tanpa DNS leak, plus Hotspot Share.

            ### Cara pakai
            1. Unduh `PanTunnel-Desktop-<platform>` dan `PanTunnel-Core-<platform>` yang cocok.
            2. Taruh keduanya di satu folder (rename core apa adanya — aplikasi mencarinya dengan nama itu).
            3. Jalankan aplikasi; UAC muncul sendiri karena TUN dan ICS butuh admin.

            ### Catatan
            - Core sing-box **dibangun dari source** (v1.11.15, tag `with_gvisor,with_clash_api`) — bukan binary pihak lain.
            - `SHA256SUMS.txt` memuat hash semua artefak.
          files: |
            dist/PanTunnel-Desktop-windows-amd64.exe
            dist/PanTunnel-Desktop-linux-amd64
            dist/PanTunnel-Desktop-macos-apple
            dist/PanTunnel-Core-windows-amd64.exe
            dist/PanTunnel-Core-linux-amd64
            dist/PanTunnel-Core-macos-apple
            dist/SHA256SUMS.txt
